name: Deploy to staging internal

on:
  # TODO(monorepo-split): disabled until v6 and the private flow is rebuilt.
  # schedule:
  #  - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (v5.0.0 or any v5.0.0 prerelease). Leave empty to use today's nightly tag."
        required: false
        type: string
      deploy_contracts:
        description: "Redeploy rollup contracts before deploying infra."
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging-internal
  cancel-in-progress: true

# actions: write lets the failure paths dispatch claudebox.yml with the built-in token
# and caps the called deploy-network.yml high enough for its failure handler.
permissions:
  contents: read
  actions: write
  # deploy-network.yml (reusable) assumes the AWS role via OIDC; a called workflow's
  # permissions are capped by the caller's, so the grant must exist here too.
  id-token: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      semver: ${{ steps.resolve.outputs.semver }}
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Resolve nightly tag
        id: resolve
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            echo "Using manually specified tag: $TAG"
          else
            TAG="v5.0.0-nightly.$(date -u +%Y%m%d)"
            echo "Using today's nightly tag: $TAG"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Error: nightly tag $TAG does not exist on origin"
              exit 1
            fi
            echo "Confirmed nightly tag $TAG exists on origin"
          fi

          SEMVER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

  wait-for-ci3:
    needs: determine-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for CI3
        run: spartan/scripts/wait_for_ci3.ts "${{ needs.determine-tag.outputs.tag }}"

  deploy:
    needs: [determine-tag, wait-for-ci3]
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: staging-internal
      semver: ${{ needs.determine-tag.outputs.semver }}
      source_tag: ${{ needs.determine-tag.outputs.tag }}
      ref: main
      deploy_contracts: ${{ inputs.deploy_contracts == true }}
      use_internal_docker_registry: true
    secrets: inherit
