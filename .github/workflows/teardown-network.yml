# Tears down a long-lived network on demand: deletes its Chaos Mesh experiments and its Kubernetes namespace.
#
# The job runs in the `network-teardown` environment, whose required reviewers are the alpha team and whose policy
# admits main alone, so every run waits for an alpha member's approval. GCP_HELM_SA_KEY is read from that environment:
# if the environment or its secret is missing, the key is empty and the teardown action fails before touching the
# cluster.
#
# mainnet and testnet are not listed.
name: Tear Down Network
run-name: Tear down ${{ inputs.network }}

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to tear down"
        required: true
        type: choice
        options:
          - next-net
          - staging-public
          - staging-internal

concurrency:
  group: teardown-network-${{ inputs.network }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teardown:
    # Re-runs are skipped: dispatch again so each teardown gets its own approval.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: network-teardown
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Each listed network's env file defaults NAMESPACE to the network's own name.
      - name: Tear down network
        uses: ./.github/actions/network-teardown
        with:
          env_file: ${{ inputs.network }}
          namespace: ${{ inputs.network }}
          gcp_helm_sa_key: ${{ secrets.GCP_HELM_SA_KEY }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
