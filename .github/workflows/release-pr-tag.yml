# Cuts a canary release from a pull request. Adding the `ci-release-pr` label pushes a
# v0.0.1-commit.g<sha> tag at the PR's head, which runs release.yml like any other release tag.
#
# The tag is minted with the release GitHub App, not the workflow token: the Release Tags ruleset
# restricts tag creation on every ref to that App, and ci3.yml deliberately holds only
# `contents: read`. It is created through the REST API rather than by pushing from a checkout, so
# the PR's tree never reaches this runner.
#
# pull_request_target rather than pull_request, for two reasons: this workflow then runs the base
# branch's own code (the PR cannot edit what mints its tag), and github.ref is the base branch,
# which is what the `tagger` environment's branch policy matches. A PR based on a branch that is
# not in that policy cannot cut a canary until the branch is added to it.
name: Release PR Tag

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: release-pr-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    # Never for forks: the release this tag triggers builds and publishes the PR's code with the
    # `release` environment's DockerHub and npm credentials.
    if: github.event.label.name == 'ci-release-pr' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    environment: tagger
    permissions:
      pull-requests: write # remove the label once the tag exists, so re-labelling re-triggers
    steps:
      - name: Mint App token
        uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create canary tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 0.0.1 so a canary can never be the newest version of anything: it cannot take an npm
          # 'latest' dist-tag, and it sorts below every real release. The 'g' prefixes the sha
          # because a prerelease identifier of digits only may not have a leading zero (semver),
          # and the Tag Format ruleset rejects the tag if it does.
          tag="v0.0.1-commit.g${HEAD_SHA:0:8}"
          echo "Tagging ${HEAD_SHA} as ${tag}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists; push a new commit to cut another canary."
            exit 1
          fi
          gh api -X POST "repos/${REPO}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${HEAD_SHA}" >/dev/null
          echo "Pushed ${tag}. Release: https://github.com/${REPO}/actions/workflows/release.yml"

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label ci-release-pr
