name: CI3 Dashboard Deploy

on:
  # Dashboard push is currently manual.
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "ci3/dashboard/**"
  #     - ".github/workflows/ci3-dashboard-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # BUILD_INSTANCE_SSH_KEY lives only in this environment, not as a repo-wide secret,
    # so it is exposed solely to this approved deploy. release-approval gates the run on
    # reviewer sign-off and restricts it to main.
    environment: release-approval
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Deploy ci3 dashboard
        env:
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          echo "${BUILD_INSTANCE_SSH_KEY}" | base64 --decode > ~/.ssh/build_instance_key
          chmod 600 ~/.ssh/build_instance_key
          ssh-keyscan -H ci.aztec-labs.com >> ~/.ssh/known_hosts 2>/dev/null

          ./ci3/dashboard/deploy.sh
