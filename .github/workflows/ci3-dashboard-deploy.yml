name: CI3 Dashboard Deploy

on:
  # Dashboard push is currently manual.
  workflow_dispatch:
    inputs:
      commit:
        description: "aztec-labs-eng/ci3 branch or commit to deploy (default: main)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy role runs a script as root on the dashboard host over SSM. It trusts only
    # this environment, which gates the run on reviewer sign-off and restricts it to main.
    environment: release-approval
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278380418400:role/gha-aztec-labs-eng-aztec-node-ci3-dashboard-deploy
          aws-region: us-east-2
          role-session-name: ci3-dashboard-deploy-${{ github.run_id }}

      - name: Deploy ci3 dashboard
        env:
          COMMIT: ${{ inputs.commit }}
        run: ./ci3/dashboard/deploy.sh "$COMMIT"
