name: Weekly Real Proving Benchmark

# Every job here checks out main. These jobs hold the `deployment` environment's GCP credential,
# so the code they run must not be selectable by whoever dispatches them; the version under test is
# the docker image, which is what the input below chooses.

on:
  # schedule:
  #   - cron: "0 6 * * 1" # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      docker_image:
        description: "Docker image to benchmark, e.g. azteclabs/aztec:6.0.0-nightly.20260921. Empty uses today's nightly."
        required: false
        type: string
        default: ""

concurrency:
  group: weekly-proving-bench-${{ github.ref }}
  cancel-in-progress: true

# actions: write lets the failure paths dispatch claudebox.yml with the built-in token
# and caps the called deploy-network.yml high enough for its failure handler.
# id-token: write lets the benchmark and cleanup jobs assume the AWS role via OIDC.
permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  select-image:
    runs-on: ubuntu-latest
    outputs:
      nightly_tag: ${{ steps.image.outputs.nightly_tag }}
      docker_image: ${{ steps.image.outputs.docker_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve the image under test
        id: image
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_DOCKER_IMAGE" ]]; then
            docker_image="$INPUT_DOCKER_IMAGE"
            nightly_tag="${docker_image##*:}"
          else
            current_version=$(jq -r '."."' .release-please-manifest.json)
            nightly_tag="${current_version}-nightly.$(date -u +%Y%m%d)"
            docker_image="azteclabs/aztec:${nightly_tag}"
          fi
          echo "nightly_tag=$nightly_tag" >> "$GITHUB_OUTPUT"
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          echo "Benchmarking image: $docker_image"

      # This workflow has no release gate, so a missing image must fail here rather than as an
      # ImagePullBackOff once the network deploy is already under way.
      - name: Verify the image exists
        run: docker manifest inspect "${{ steps.image.outputs.docker_image }}" >/dev/null

  deploy-real-proving-network:
    needs: select-image
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: prove-n-tps-real
      namespace: prove-n-tps-real
      image_tag: ${{ needs.select-image.outputs.nightly_tag }}
      skip_notify_on_failure: true
    secrets: inherit

  wait-for-first-l2-block:
    needs:
      - select-image
      - deploy-real-proving-network
    runs-on: ubuntu-latest
    # GCP_HELM_SA_KEY lives in the deployment environment, whose policy admits only main.
    environment: deployment
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_HELM_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Wait for first L2 block
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          cd spartan
          ./bootstrap.sh wait_for_l2_block prove-n-tps-real

  benchmark:
    needs:
      - select-image
      - wait-for-first-l2-block
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: weekly-proving-bench-${{ github.run_id }}
          role-duration-seconds: 12600 # 3.5h – covers the 3h step timeout + buffer

      - name: Run real proving benchmarks
        timeout-minutes: 180
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_HELM_SA_KEY: ${{ secrets.GCP_HELM_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 180
          NO_SPOT: 1
          SKIP_NETWORK_DEPLOY: "1"
          # Publishes to the custom network-dashboard pipeline (GCS) tagged as the
          # real-proving benchmark, grouped as one sweep per run.
          BENCH_SWEEP_ID: real-proving-${{ github.run_id }}
          BENCH_SWEEP_LABEL: real-proving
          BENCH_BENCHMARK_TYPE: real-proving
        run: |
          ./.github/ci3.sh network-proving-bench prove-n-tps-real prove-n-tps-real

  cleanup:
    if: ${{ always() }}
    needs:
      - select-image
      - deploy-real-proving-network
      - wait-for-first-l2-block
      - benchmark
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: weekly-proving-cleanup-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Cleanup network resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_HELM_SA_KEY: ${{ secrets.GCP_HELM_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: ./.github/ci3.sh network-teardown prove-n-tps-real prove-n-tps-real

  notify:
    if: (success() || failure()) && github.event_name != 'workflow_dispatch'
    needs:
      - select-image
      - deploy-real-proving-network
      - wait-for-first-l2-block
      - benchmark
      - cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          export CI=1
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify \
            "Weekly real proving benchmark passed (nightly tag ${TAG}) :white_check_mark: <${RUN_URL}|View Run>" \
            "#alerts-next-scenario"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Weekly Real Proving Benchmark FAILED (nightly tag ${TAG}): <${RUN_URL}|View Run> (🤖)" \
            "Weekly real proving benchmark failed (nightly tag ${TAG}). CI run: ${RUN_URL}. Investigate the benchmark failure and identify the root cause." \
            --link "$RUN_URL"
