# CI for Aztec Network Scenarios: deploys a network and runs scenario tests against it.
# If test_set is empty, runs both sets in parallel.
#
# Two entry points:
# - schedule (currently disabled): runs against today's nightly release once its release
#   run has published the image (select-image + wait-for-release, same model as
#   deploy-next-net.yml). A day with no nightly tag fails loudly at select-image
#   rather than silently re-testing yesterday's image.
# - workflow_dispatch: manual runs against an explicit docker image and namespace.
name: Test Network Scenarios

on:
  # schedule:
  #   # Run every morning at 6:00 AM UTC, after the nightly tag (04:00 UTC) has built.
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of azteclabs/aztec to test, e.g. 6.0.0-nightly.20260921. Empty uses today's nightly.
        required: false
        type: string
        default: ""
      namespace:
        description: Kubernetes namespace to use (will be sanitized for k8s naming). Empty derives one from the image.
        required: false
        type: string
        default: ""
      env_file:
        description: Network configuration to use (local, devnet, testnet, next-scenario, tps-scenario)
        required: false
        type: string
        default: next-scenario
      test_set:
        description: Test set to run (1, 2, or empty for both in parallel)
        required: false
        type: string
        default: ""

concurrency:
  group: test-network-scenarios-${{ inputs.namespace || 'nightly' }}
  cancel-in-progress: true

# actions: write lets the failure handler dispatch claudebox.yml with the built-in
# token (and covers wait_for_release's workflow-run queries).
# id-token: write lets the job assume the AWS role via OIDC.
permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  # Resolves the image under test: the input if given, otherwise today's nightly (never
  # "latest", so a broken tag cron fails here instead of silently re-testing an old image).
  select-image:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.image.outputs.docker_image }}
      semver: ${{ steps.image.outputs.semver }}
      release_tag: ${{ steps.image.outputs.release_tag }}
      env_file: ${{ steps.image.outputs.env_file }}
      test_sets: ${{ steps.image.outputs.test_sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve the image under test
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_ENV_FILE: ${{ inputs.env_file }}
          INPUT_TEST_SET: ${{ inputs.test_set }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_IMAGE_TAG" ]]; then
            image_tag="$INPUT_IMAGE_TAG"
            release_tag=""
          else
            current_version=$(jq -r '."."' .release-please-manifest.json)
            image_tag="${current_version}-nightly.$(date -u +%Y%m%d)"
            release_tag="v${image_tag}"
          fi
          # The OCI tag grammar, as deploy-network.yml applies it. This value is written to
          # $GITHUB_OUTPUT and reaches a run: script, so a newline in it could forge a second
          # output line. The rejected value is deliberately not echoed, for the same reason.
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid docker image tag rejected."
            exit 1
          fi
          # The registry and repository are fixed, never taken from input: only the tag varies, so
          # no other image is expressible here.
          docker_image="azteclabs/aztec:${image_tag}"
          # env_file names a file under spartan/environments and test_set picks a matrix leg.
          # Both reach a run: script, so they are checked here rather than interpolated raw.
          env_file="${INPUT_ENV_FILE:-next-scenario}"
          if [[ ! "$env_file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid env_file rejected."
            exit 1
          fi
          case "${INPUT_TEST_SET:-}" in
            "") test_sets='["1","2"]' ;;
            1|2) test_sets="[\"${INPUT_TEST_SET}\"]" ;;
            *) echo "::error::test_set must be 1, 2, or empty for both."; exit 1 ;;
          esac
          echo "env_file=$env_file" >> "$GITHUB_OUTPUT"
          echo "test_sets=$test_sets" >> "$GITHUB_OUTPUT"
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          echo "semver=$image_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Testing image: $docker_image"

      # A named image has to exist already; a derived nightly is gated by wait-for-release instead,
      # since its release build may still be running.
      - name: Verify the image exists
        if: steps.image.outputs.release_tag == ''
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.docker_image }}
        run: docker manifest inspect "$DOCKER_IMAGE" >/dev/null

  # Block until the nightly tag's release build has published the docker image,
  # so the deploy below doesn't race the build and hit ImagePullBackOff.
  wait-for-release:
    needs: select-image
    # Only a derived nightly needs the gate; a named image was verified above.
    if: needs.select-image.outputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for release
        env:
          RELEASE_TAG: ${{ needs.select-image.outputs.release_tag }}
        run: spartan/scripts/wait_for_release.ts "$RELEASE_TAG"

  deploy-and-test:
    needs: [select-image, wait-for-release]
    # The gate is skipped for a named image and must pass for a derived nightly.
    if: ${{ !cancelled() && needs.select-image.result == 'success' && needs.wait-for-release.result != 'failure' }}
    runs-on: ubuntu-latest
    # GCP_HELM_SA_KEY lives in the deployment environment, whose policy admits only main.
    environment: deployment
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(needs.select-image.outputs.test_sets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: test-network-scenarios-${{ github.run_id }}
          role-duration-seconds: 23400 # 6.5h – covers AWS_SHUTDOWN_TIME (360 min) + 30 min buffer

      - name: Resolve namespace
        env:
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          SEMVER: ${{ needs.select-image.outputs.semver }}
          RUN_ID: ${{ github.run_id }}
          DOCKER_IMAGE: ${{ needs.select-image.outputs.docker_image }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_NAMESPACE" ]]; then
            namespace=$(echo "$INPUT_NAMESPACE" | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
          elif major=$(./ci3/semver major "$SEMVER" 2>/dev/null) && [[ -n "$major" ]]; then
            namespace="v${major}-scenario"
          else
            # A tag that is not semver (a PR image, say) has no release line to name.
            namespace="run-${RUN_ID}-scenario"
          fi
          echo "NAMESPACE=$namespace" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV

      - name: Run Network Scenarios
        timeout-minutes: 350
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_HELM_SA_KEY: ${{ secrets.GCP_HELM_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 360
          NO_SPOT: 1
          ENV_FILE: ${{ needs.select-image.outputs.env_file }}
          TEST_SET: ${{ matrix.test_set }}
        run: |
          set -x # print next line
          ./.github/ci3.sh network-scenarios "$ENV_FILE" "$NAMESPACE" "$DOCKER_IMAGE" "$TEST_SET"

      - name: Cleanup network resources
        if: always()
        continue-on-error: true
        uses: ./.github/actions/network-teardown
        with:
          env_file: ${{ needs.select-image.outputs.env_file }}
          namespace: ${{ env.NAMESPACE }}-${{ matrix.test_set }}
          gcp_helm_sa_key: ${{ secrets.GCP_HELM_SA_KEY }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}

      #############
      # Benchmarks
      #############
      - name: Download deploy benchmarks
        if: always() && github.event_name == 'schedule'
        run: |
          if ./ci.sh gh-deploy-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> $GITHUB_ENV
          fi

      - name: Upload benchmarks
        if: env.ENABLE_DEPLOY_BENCH == '1'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: ./ci3/upload_benchmarks "Aztec Benchmarks" "bench/${BENCH_BRANCH:-}" ./bench-out/bench.json "$COMMIT_SHA"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ENV_FILE: ${{ needs.select-image.outputs.env_file }}
          TEST_SET: ${{ matrix.test_set }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONTEXT="set ${TEST_SET}, image ${DOCKER_IMAGE:-unset}, env ${ENV_FILE}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Scenario Tests FAILED (${CONTEXT}): <${RUN_URL}|View Run> (🤖)" \
            "Scenario tests failed (${CONTEXT}). CI run: ${RUN_URL}. Investigate the scenario test failure and identify the root cause." \
            --link "$RUN_URL"
