# CI for Aztec Network Scenarios: deploys a network and runs scenario tests against it.
# If test_set is empty, runs both sets in parallel.
#
# Two entry points:
# - schedule (currently disabled): runs against today's nightly release once its CI3
#   run has published the image (select-image + wait-for-ci3, same model as
#   deploy-next-net.yml). A day with no nightly tag fails loudly at select-image
#   rather than silently re-testing yesterday's image.
# - workflow_dispatch: manual runs against an explicit docker image and namespace.
name: Test Network Scenarios

on:
  # schedule:
  #   # Run every morning at 6:00 AM UTC, after the nightly tag (04:00 UTC) has built.
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      docker_image:
        description: Complete docker image to use (e.g., aztecprotocol/aztec:some-tag)
        required: true
        type: string
      ref:
        description: Git ref to checkout for the scenario runner.
        required: false
        type: string
        default: main
      namespace:
        description: Kubernetes namespace to use (will be sanitized for k8s naming)
        required: true
        type: string
      env_file:
        description: Network configuration to use (local, devnet, testnet, next-scenario, tps-scenario)
        required: false
        type: string
        default: next-scenario
      test_set:
        description: Test set to run (1, 2, or empty for both in parallel)
        required: false
        type: string
        default: ""

concurrency:
  group: test-network-scenarios-${{ inputs.namespace || 'nightly' }}
  cancel-in-progress: true

# actions: write lets the failure handler dispatch claudebox.yml with the built-in
# token (and covers wait_for_ci3's workflow-run queries on scheduled runs).
# id-token: write lets the job assume the AWS role via OIDC.
permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  # Scheduled runs only: construct today's nightly tag (never "latest", so a broken
  # tag cron fails here instead of silently re-testing an old image).
  select-image:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.nightly-tag.outputs.semver }}
      source_ref: ${{ steps.nightly-tag.outputs.source_ref }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main

      - name: Determine nightly tag
        id: nightly-tag
        run: |
          current_version=$(jq -r '."."' .release-please-manifest.json)
          semver="${current_version}-nightly.$(date -u +%Y%m%d)"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "source_ref=v$semver" >> "$GITHUB_OUTPUT"
          echo "Using nightly tag: v$semver"

      - name: Verify source git ref
        id: verify
        run: |
          set -euo pipefail
          source_ref="${{ steps.nightly-tag.outputs.source_ref }}"
          git fetch --depth 1 origin "refs/tags/${source_ref}:refs/tags/${source_ref}"
          source_sha=$(git rev-parse "${source_ref}^{}")
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Nightly source commit: $source_sha"

  # Block until the nightly tag's release build has published the docker image,
  # so the deploy below doesn't race the build and hit ImagePullBackOff.
  wait-for-ci3:
    needs: select-image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for CI3
        run: spartan/scripts/wait_for_ci3.ts "${{ needs.select-image.outputs.source_ref }}"

  deploy-and-test:
    needs: [select-image, wait-for-ci3]
    # Dispatch runs skip the nightly gate jobs; scheduled runs require the gate to pass.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.wait-for-ci3.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(inputs.test_set == '' && '["1","2"]' || format('["{0}"]', inputs.test_set)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Scheduled runs check out the nightly tag so the runner matches the release.
          ref: ${{ inputs.ref || needs.select-image.outputs.source_ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: test-network-scenarios-${{ github.run_id }}
          role-duration-seconds: 23400 # 6.5h – covers AWS_SHUTDOWN_TIME (360 min) + 30 min buffer

      - name: Resolve docker image and namespace
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          NIGHTLY_SEMVER: ${{ needs.select-image.outputs.semver }}
        run: |
          if [[ -n "$INPUT_NAMESPACE" ]]; then
            namespace=$(echo "$INPUT_NAMESPACE" | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
            docker_image="$INPUT_DOCKER_IMAGE"
          elif [[ -n "$NIGHTLY_SEMVER" ]]; then
            major_version=$(./ci3/semver major "$NIGHTLY_SEMVER")
            namespace="v${major_version}-scenario"
            docker_image="aztecprotocol/aztec:${NIGHTLY_SEMVER}"
          else
            echo "No namespace input and no nightly tag context." >&2
            exit 1
          fi
          echo "NAMESPACE=$namespace" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=$docker_image" >> $GITHUB_ENV

      - name: Run Network Scenarios
        timeout-minutes: 350
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERNAL_DOCKER_REGISTRY: ${{ vars.INTERNAL_DOCKER_REGISTRY }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 360
          NO_SPOT: 1
        run: |
          set -x # print next line
          ./.github/ci3.sh network-scenarios "${{ inputs.env_file || 'next-scenario' }}" "$NAMESPACE" "$DOCKER_IMAGE" "${{ matrix.test_set }}"

      - name: Cleanup network resources
        if: always()
        continue-on-error: true
        uses: ./.github/actions/network-teardown
        with:
          env_file: ${{ inputs.env_file || 'next-scenario' }}
          namespace: ${{ env.NAMESPACE }}-${{ matrix.test_set }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}

      #############
      # Benchmarks
      #############
      - name: Download deploy benchmarks
        if: always() && github.event_name == 'schedule'
        run: |
          if ./ci.sh gh-deploy-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> $GITHUB_ENV
          fi

      - name: Upload benchmarks
        if: env.ENABLE_DEPLOY_BENCH == '1'
        env:
          COMMIT_SHA: ${{ needs.select-image.outputs.source_sha || github.sha }}
        run: ./ci3/upload_benchmarks "Aztec Benchmarks" "bench/${BENCH_BRANCH:-}" ./bench-out/bench.json "$COMMIT_SHA"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONTEXT="set ${{ matrix.test_set }}, image ${DOCKER_IMAGE:-unset}, env ${{ inputs.env_file || 'next-scenario' }}, ref ${{ github.ref_name }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Scenario Tests FAILED (${CONTEXT}): <${RUN_URL}|View Run> (🤖)" \
            "Scenario tests failed (${CONTEXT}). CI run: ${RUN_URL}. Investigate the scenario test failure and identify the root cause." \
            --link "$RUN_URL"
