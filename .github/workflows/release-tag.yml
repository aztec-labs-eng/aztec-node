# Creates release tags via the release GitHub App — the only identity the
# release-tags ruleset permits to create v* tags.
#
#   nightly:  cron                          -> v<ver>-nightly.<date>
#             per branch in the nightly matrix below; the one unattended
#             path, via the `tagger` environment. Also dispatchable, to cut a
#             day the cron missed or botched. That path takes an optional
#             suffix (-> v<ver>-nightly.<date>.<suffix>) so a re-cut does not
#             collide with a tag the cron already pushed, and is gated by
#             `release-approval` like every other dispatch.
#   rc:       dispatch with kind=rc         -> v<ver>-rc.<n>
#             n is derived from origin's existing rc tags for that version
#             (max + 1, starting at 1). Gated by `release-approval` like a
#             real release; artifacts publish to the 'rc' channel and never
#             take 'latest'.
#   release:  dispatch with kind=release    -> v<ver>
#             gated by the `release-approval` environment: required reviewers
#             with self-review prevented, so cutting a release takes two
#             distinct humans.
#
# rc numbers are dotted (-rc.N, not -rcN): semver compares the dotted N
# numerically (rc.2 < rc.10) but an undotted rcN lexically (rc10 < rc2), and
# ci3/dist_tag takes the first dot-separated prerelease identifier as the
# release channel — 'rc' — where rcN would mint a fresh channel per candidate.
#
# Multi-branch model: scheduled/dispatched runs always execute THIS file from
# the default branch, so the token-minting code is always the reviewed code on
# main — and the environments' deployment policy stays main-only for the same
# reason.
#
# To start a new release line, add it in both places below: the `branch`
# options for on-demand tagging and the matrix list for nightlies
# (a one-line reviewed PR each).

name: Release Tag

on:
  schedule:
    # Every night at 4:00 AM UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "a nightly re-cut, a release candidate, or a real release"
        type: choice
        options: [nightly, rc, release]
        default: rc
      # A choice, not free text: this value reaches both the checkout ref and
      # the tagging step, and git accepts shell metacharacters in a ref name.
      branch:
        description: "release line to tag (its manifest supplies the version)"
        type: choice
        options: [main]
        default: main
      # Free text, unlike the two above, because it can afford to be: it reaches
      # no action input and no checkout ref, only the tag name, and it arrives
      # as an env var, which bash never parses as code. The pattern checked in
      # the script is what keeps it one semver prerelease identifier and a legal
      # ref component.
      suffix:
        description: "nightly only: tells a re-cut apart from the day's scheduled tag, e.g. 'hotfix' -> v<ver>-nightly.<date>.hotfix"
        type: string
        default: ""

jobs:
  tag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TO ADD A NEW RELEASE LINE to the nightly schedule: extend the LAST
        # list in this expression, e.g. fromJSON('["main", "v6"]'). Nothing else
        # changes — no environment, ruleset, or App-installation edits (see the
        # multi-branch model in the header). The first arm of the expression is
        # not a branch list: it collapses dispatch runs to the one requested branch.
        branch: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.branch)) || fromJSON('["main"]') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.repository }}-${{ matrix.branch }}
    # Every dispatch costs a second human, a nightly re-cut included: the
    # expression keys on the event, not the kind. The cron is the only path
    # through `tagger`.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-approval' || 'tagger' }}
    steps:
      - name: Mint App token
        # SHA-pinned, not @v2: this is the step the private key is passed to, so a
        # moved tag upstream would be arbitrary code beside the key.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Do NOT bump to checkout v6 (see the pinning rationale in ci3.yml).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ matrix.branch }}
          token: ${{ steps.app.outputs.token }}

      - name: Create and push tag
        # Passed as env rather than interpolated with ${{ }}: an expression is
        # substituted into the script before bash parses it, so its value would
        # be executed as shell text.
        env:
          BRANCH: ${{ matrix.branch }}
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'nightly' }}
          SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.suffix || '' }}
        run: |
          set -euo pipefail
          git config --global user.email "noreply@aztec-labs.com"
          git config --global user.name "Aztec Labs release"
          version=$(jq -r '."."' .release-please-manifest.json)
          # The whole tag name is built from this, so refuse anything that is not
          # a plain X.Y.Z before it reaches a ref name.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manifest version on $BRANCH is not X.Y.Z: $version"
            exit 1
          fi
          suffix=${SUFFIX:-}
          if [ -n "$suffix" ]; then
            if [ "$KIND" != nightly ]; then
              echo "::error::suffix applies to kind=nightly only; rc and release are numbered by their own schemes."
              exit 1
            fi
            # One semver prerelease identifier. Keeps the tag valid semver, keeps
            # ci3/dist_tag reading the channel as 'nightly' (it takes the first
            # dot-separated identifier), and admits nothing that would change the
            # meaning of the ref name: no dot, slash, or leading hyphen.
            if [[ ! "$suffix" =~ ^[a-z][a-z0-9-]{0,19}$ ]]; then
              echo "::error::Invalid suffix '$suffix': 1-20 characters, lowercase letters, digits and hyphens, starting with a letter."
              exit 1
            fi
          fi
          case "$KIND" in
            release)
              tag="v${version}"
              ;;
            rc)
              # Next candidate number comes from origin, not the clone: list the
              # existing v<ver>-rc.* tags and take max+1 (1 when none). The trailing
              # anchor also drops ls-remote's peeled ^{} duplicates.
              last=$(git ls-remote --tags origin "refs/tags/v${version}-rc.*" \
                | sed -n "s|.*refs/tags/v${version}-rc\.\([0-9][0-9]*\)$|\1|p" \
                | sort -n | tail -1)
              tag="v${version}-rc.$(( ${last:-0} + 1 ))"
              ;;
            *)
              tag="v${version}-nightly.$(date -u +%Y%m%d)"
              if [ -n "$suffix" ]; then
                tag="${tag}.${suffix}"
              fi
              ;;
          esac
          echo "Tagging $BRANCH @ $(git rev-parse --short HEAD): $tag"
          # Refuse to move an existing tag: re-dispatching a release without a
          # version-bump PR must fail loudly, not re-tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$KIND" = nightly ] && [ -n "$suffix" ]; then
              echo "::error::Tag $tag already exists. Re-dispatch with a different suffix."
            elif [ "$KIND" = nightly ]; then
              echo "::error::Tag $tag already exists. Re-dispatch with a suffix to cut a distinct nightly for today, e.g. suffix=hotfix."
            else
              echo "::error::Tag $tag already exists. Bump .release-please-manifest.json on $BRANCH first."
            fi
            exit 1
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      # Nightly tagging is unattended, so a failure here is otherwise invisible: no tag is
      # pushed and the release run that would report it never starts. Posted inline rather
      # than via ci3/slack_notify because two of the three steps above can fail before the
      # repo is checked out.
      - name: Notify Slack on tagging failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'nightly' }}
          BRANCH: ${{ matrix.branch }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "No SLACK_BOT_TOKEN, skipping notification"
            exit 0
          fi
          TEXT="Release tagging FAILED (${KIND}, branch *${BRANCH}*, ${ACTOR}): <${RUN_URL}|View Run>"
          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            --data "$(jq -n --arg c '#team-alpha-ci' --arg t "$TEXT" '{channel:$c, text:$t}')")
          # Slack returns 200 on errors, so surface a bad channel/token instead of dropping it.
          if [ "$(jq -r '.ok // false' <<<"$response")" != "true" ]; then
            echo "Failed to post to Slack: $(jq -r '.error // empty' <<<"$response")" >&2
          fi
