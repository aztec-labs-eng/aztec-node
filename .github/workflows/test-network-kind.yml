# KIND-based e2e tests that run on a local Kubernetes cluster on an EC2 instance.
#
# Every checkout in this file is pinned to main. These jobs hold the `deployment` environment's GCP credential, so the
# code they run must not be selectable by whoever dispatches them; the version under test is the
# docker image, which is what the input below chooses. A dispatch with no image tests today's
# nightly, the same thing the (currently disabled) schedule does.
name: Test Network KIND

on:
  # schedule:
  #   # Run every morning at 6:00 AM UTC, after the nightly tag (04:00 UTC) has built.
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker image to test, e.g. azteclabs/aztec:6.0.0-nightly.20260921. Empty uses today's nightly.
        required: false
        type: string
        default: ""

# id-token: write lets the job assume the AWS role via OIDC.
# actions: read covers wait_for_release's workflow-run queries.
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # Resolves the image under test: the input if given, otherwise today's nightly (never
  # "latest", so a broken tag cron fails here instead of silently re-testing an old release).
  select-image:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.image.outputs.docker_image }}
      release_tag: ${{ steps.image.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve the image under test
        id: image
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_DOCKER_IMAGE" ]]; then
            docker_image="$INPUT_DOCKER_IMAGE"
            release_tag=""
          else
            current_version=$(jq -r '."."' .release-please-manifest.json)
            docker_image="azteclabs/aztec:${current_version}-nightly.$(date -u +%Y%m%d)"
            release_tag="v${current_version}-nightly.$(date -u +%Y%m%d)"
          fi
          # This value is written to $GITHUB_OUTPUT and reaches a run: script, so anything that
          # could forge a second output line or break out of a quoted argument is refused. The
          # rejected value is deliberately not echoed, for the same reason.
          if [[ ! "$docker_image" =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]*$ ]]; then
            echo "::error::Invalid docker image reference rejected."
            exit 1
          fi
          # An untagged reference resolves to :latest, which these runs never want and which the
          # terraform that splits the reference on ':' cannot handle.
          if [[ "${docker_image##*/}" != *:* ]]; then
            echo "::error::Name the tag explicitly, e.g. azteclabs/aztec:6.0.0-nightly.20260921"
            exit 1
          fi
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Testing image: $docker_image"

      # A named image has to exist already; a derived nightly is gated by wait-for-release instead,
      # since its release build may still be running.
      - name: Verify the image exists
        if: steps.image.outputs.release_tag == ''
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.docker_image }}
        run: docker manifest inspect "$DOCKER_IMAGE" >/dev/null

  # Block until the nightly tag's release CI has succeeded, so we only test releases
  # that actually shipped.
  wait-for-release:
    needs: select-image
    # Only a derived nightly needs the gate; a named image was verified above.
    if: needs.select-image.outputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for release
        run: spartan/scripts/wait_for_release.ts "${{ needs.select-image.outputs.release_tag }}"

  kind-test:
    needs: [select-image, wait-for-release]
    # The gate is skipped for a named image and must pass for a derived nightly.
    if: ${{ !cancelled() && needs.select-image.result == 'success' && needs.wait-for-release.result != 'failure' }}
    runs-on: ubuntu-latest
    # GCP_HELM_SA_KEY lives in the deployment environment, whose policy admits only main.
    environment: deployment
    timeout-minutes: 180 # 3 hours for KIND tests
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: test-network-kind-${{ github.run_id }}
          role-duration-seconds: 12600 # 3.5h – covers AWS_SHUTDOWN_TIME (180 min) + 30 min buffer

      - name: Run KIND Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_HELM_SA_KEY: ${{ secrets.GCP_HELM_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 180
          DOCKER_IMAGE: ${{ needs.select-image.outputs.docker_image }}
        run: |
          ./.github/ci3.sh network-tests-kind "$DOCKER_IMAGE"
