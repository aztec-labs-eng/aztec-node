# KIND-based e2e tests that run on a local Kubernetes cluster on an EC2 instance.
#
# Two entry points:
# - schedule (currently disabled): runs against today's nightly release once its CI3
#   run has finished (select-image + wait-for-ci3, same model as deploy-next-net.yml).
#   A day with no nightly tag fails loudly at select-image.
# - workflow_dispatch: manual runs against an arbitrary ref.
name: Test Network KIND

on:
  # schedule:
  #   # Run every morning at 6:00 AM UTC, after the nightly tag (04:00 UTC) has built.
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to checkout for the KIND test runner.
        required: false
        type: string
        default: main

# id-token: write lets the job assume the AWS role via OIDC.
# actions: read covers wait_for_ci3's workflow-run queries on scheduled runs.
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # Scheduled runs only: construct today's nightly tag (never "latest", so a broken
  # tag cron fails here instead of silently re-testing an old release).
  select-image:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.nightly-tag.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main

      - name: Determine nightly tag
        id: nightly-tag
        run: |
          current_version=$(jq -r '."."' .release-please-manifest.json)
          source_ref="v${current_version}-nightly.$(date -u +%Y%m%d)"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Using nightly tag: $source_ref"

      - name: Verify source git ref
        run: |
          set -euo pipefail
          source_ref="${{ steps.nightly-tag.outputs.source_ref }}"
          git fetch --depth 1 origin "refs/tags/${source_ref}:refs/tags/${source_ref}"
          echo "Nightly source commit: $(git rev-parse "${source_ref}^{}")"

  # Block until the nightly tag's release CI has succeeded, so we only test releases
  # that actually shipped.
  wait-for-ci3:
    needs: select-image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for CI3
        run: spartan/scripts/wait_for_ci3.ts "${{ needs.select-image.outputs.source_ref }}"

  kind-test:
    needs: [select-image, wait-for-ci3]
    # Dispatch runs skip the nightly gate jobs; scheduled runs require the gate to pass.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.wait-for-ci3.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours for KIND tests
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Scheduled runs check out the nightly tag so the tests match the release.
          ref: ${{ inputs.ref || needs.select-image.outputs.source_ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: test-network-kind-${{ github.run_id }}
          role-duration-seconds: 12600 # 3.5h – covers AWS_SHUTDOWN_TIME (180 min) + 30 min buffer

      - name: Run KIND Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 180
        run: |
          ./.github/ci3.sh network-tests-kind
