# Ensure environments have all publisher keys and bot accounts funded.
# Runs daily over all environments, or on demand for one (or all) of them.
name: Ensure Funded Environments

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to fund"
        required: false
        type: choice
        default: all
        options:
          - all
          - staging-public
          - staging-internal
          - next-net
          - testnet
          - tps-scenario
      low_watermark:
        description: "Minimum ETH balance"
        required: false
        type: string
        default: "0.5"
      high_watermark:
        description: "Target ETH balance when funding"
        required: false
        type: string
        default: "1.0"
  schedule:
    # Run daily at 4 AM UTC
    - cron: "0 4 * * *"

concurrency:
  group: ensure-funded-environments
  cancel-in-progress: false # Don't cancel funding operations

jobs:
  fund:
    name: ${{ matrix.network }}
    runs-on: ubuntu-latest
    # GCP_SA_KEY lives in the deployment environment, whose policy admits only main.
    environment: deployment
    strategy:
      # we can only run one funding operation at a time because all jobs fund from the same address
      max-parallel: 1
      fail-fast: false
      matrix:
        network: ${{ fromJSON((inputs.network == '' || inputs.network == 'all') && '["staging-public","staging-internal","next-net","testnet"]' || format('["{0}"]', inputs.network)) }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate inputs
        run: |
          # Validate environment
          if [[ ! -f "spartan/environments/${{ matrix.network }}.env" ]]; then
            echo "Error: Environment file not found for environment '${{ matrix.network }}'"
            echo "Available environments:"
            ls -1 spartan/environments/ | grep -v '\.local\.env$' || echo "No environment files found"
            exit 1
          fi

      - name: Store the GCP key in a file
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set +x
          umask 077
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          jq -e . "$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null

      - name: Setup GCP authentication
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Fetch secrets from GCP
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # Fetch the environment-specific secrets
          FUNDING_PRIVATE_KEY=$(gcloud secrets versions access latest --secret="sepolia-funding-private-key" --project="$GCP_PROJECT_ID")
          EXTERNAL_ETHEREUM_HOST=$(gcloud secrets versions access latest --secret="sepolia-external-ethereum-host" --project="$GCP_PROJECT_ID")
          echo "::add-mask::$FUNDING_PRIVATE_KEY"
          echo "::add-mask::$EXTERNAL_ETHEREUM_HOST"

          # Export to environment
          {
            printf 'FUNDING_PRIVATE_KEY=%s\n' "$FUNDING_PRIVATE_KEY"
            printf 'EXTERNAL_ETHEREUM_HOST=%s\n' "$EXTERNAL_ETHEREUM_HOST"
          } >> "$GITHUB_ENV"

      - name: Ensure funded environment
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          cd spartan/scripts

          # Run the funding script (scheduled runs have no inputs and use the higher watermarks)
          ./ensure_funded_environment.sh \
            "${{ matrix.network }}" \
            "$FUNDING_PRIVATE_KEY" \
            "${{ inputs.low_watermark || '5.0' }}" \
            "${{ inputs.high_watermark || '10.0' }}"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [[ "${{ matrix.network }}" == "tps-scenario" ]]; then
            export ALERT_CHANNEL="#alerts-next-net"
          else
            export ALERT_CHANNEL="#alerts-${{ matrix.network }}"
          fi

          if [ -n "${SLACK_BOT_TOKEN}" ]; then
            read -r -d '' data <<EOF || true
            {
              "channel": "$ALERT_CHANNEL",
              "text": "Ensure Funded Environments workflow FAILED for *${{ matrix.network }}*: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
          EOF
            curl -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-type: application/json" \
              --data "$data"
          fi
