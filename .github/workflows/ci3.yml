# CI for Aztec. At a high-level, runs ./bootstrap.sh ci in root. See root README.md for more details.
# Only for internal devs. For external devs, see ci3-external.yml.
#
# CAREFUL! We use "exec" a lot to ensure signal propagation to the child process, to allow proper ec2 cleanup.
name: CI3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ci3-${{ github.ref_name }}
  # Never cancel main-branch runs: each push to main is a full run that produces the
  # per-commit benchmark series, so a newer push must queue behind it, not kill it.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # The main CI job for Aztec. Fast runs gate pull requests; every push to main runs
  # full CI, which also produces the per-commit benchmark series (bench/main).
  #
  # This orchestrates AWS EC2 spot instances then remotely runs ./bootstrap.sh
  # The ci-full label enables heavier tests. For other labels, see ci3.sh.
  #
  #            Standard PR                       Push to main
  #                  |                                 |
  #      |  1x AMD64 EC2 Spot  |           |  1x AMD64 EC2 Spot (full) |
  #             (fast)                     |  + dedicated bench box    |
  #
  # If you suspect a flaky test, look for people recently reporting similar things.
  # Otherwise, spend time ensuring it is not your PR. Spend some time attempting to fix it.
  # Try not to just increase timeouts. Post either about your fix or your efforts where
  # engineers can broadly see it.
  ci:
    runs-on: ubuntu-latest
    # exclusive with ci3-external.yml: never run on forks
    # (github.event.pull_request.head.repo.fork resolves to nil if not a pull request)
    if: github.event.pull_request.head.repo.fork != true && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci-draft'))
    # Tag runs get the `release` environment: DockerHub/npm publish secrets, with a
    # deployment tag policy restricting it to v* refs. Non-tag runs get no environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      id-token: write # required for OIDC assume-role with AWS
      contents: read # checkout/fetch with the default github.token
      statuses: write # post_github_status posts per-job commit statuses (ci/x-fast etc.) with github.token
    steps:
      # Do NOT bump actions/checkout to v6 here. v6 ("persist creds to a separate file", #2286)
      # stores the persisted github.token in a temp credentials file pulled in via includeIf, which
      # `git config --unset-all http....extraheader` cannot clear. Our runner-side pushes
      # (ci3.sh release-pr tag) rely on swapping that header for a bot-PAT remote, so under v6
      # they push as github-actions[bot] (contents: read) and 403. v5.0.1 is still node24 but
      # keeps the credential as a removable local extraheader.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The commit to checkout. We want our actual commit, and not the result of merging the PR to the target.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fetch all of the PR's commits.
          fetch-depth: ${{ github.event.pull_request.commits || 1 }}
          # Persisted for authenticated reads; pushes swap in a bot-PAT remote at each push site.
          persist-credentials: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: ci3-${{ github.run_id }}
          role-duration-seconds: 7200 # 2h – covers max AWS_SHUTDOWN_TIME (90 min ARM) + 30 min buffer

      - name: Determine CI Mode
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Parse labels from JSON env var to avoid shell injection via label names
          mapfile -t LABELS < <(echo "$PR_LABELS_JSON" | jq -r '.[]')
          ./.github/ci3_labels_to_env.sh "${LABELS[@]}"

      - name: Run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # Internal GCP Artifact Registry that private releases push the docker image to (see
          # bootstrap.sh::private_release). Empty here, where releases publish normally.
          INTERNAL_DOCKER_REGISTRY: ${{ vars.INTERNAL_DOCKER_REGISTRY }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          # Forwarded to EC2 so release_compat_e2e's nightly-failure Slack alert can build a real run URL.
          RUN_ID: ${{ github.run_id }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
        # NOTE: $CI_MODE is set in the Determine CI Mode step.
        run: ./.github/ci3.sh $CI_MODE

      - name: Post-Actions
        run: ./.github/ci3_success.sh

      # A pushed v* tag is the release path (ci3_labels_to_env.sh selects ci_mode=release on
      # exactly this condition), so this covers nightly, rc and stable releases. Gating on the
      # ref rather than env.CI_MODE also keeps it working when the job dies before the mode is
      # computed. Canary tags from the ci-release-pr label are excluded: they get their own
      # alert from ci3/release_canary_slack_notify.
      - name: Notify Slack on release failure
        if: failure() && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v0.0.1-commit.')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$TAG" in
            *-nightly.*) kind="Nightly release" ;;
            *-rc.*) kind="Release candidate" ;;
            *) kind="Release" ;;
          esac
          text="$kind FAILED for *${TAG}* (${ACTOR}): <${RUN_URL}|View Run>"
          # Set by ci3/bootstrap_ec2 once the build reaches the instance; absent if we failed earlier.
          if [ -n "${CI_LOG_ID:-}" ]; then
            text="${text} | <http://ci.aztec-labs.com/${CI_LOG_ID}|Build Log>"
          fi
          ./ci3/slack_notify "$text" "#team-alpha"

      # Uses ci3/upload_benchmarks rather than github-action-benchmark: the action full-clones
      # the multi-GB data repo per upload; the script does a shallow sparse clone instead.
      - name: Upload benchmarks
        # TODO(A-1764): Setup benchmarks.
        if: false && env.BENCH_UPLOAD == '1'
        env: &ci_benchmark_env
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: &ci_benchmark_run ./ci3/upload_benchmarks "Aztec Benchmarks" "bench/${BENCH_BRANCH:-}" ./bench-out/bench.json "$COMMIT_SHA"

  # Validates that a nightly tag's embedded date matches today's UTC date.
  # Prevents stale or replayed nightly tags from triggering scenario tests.
  validate-nightly-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-nightly.')
    outputs:
      is_current: ${{ steps.check.outputs.is_current }}
    steps:
      - name: Check nightly tag date matches today (UTC)
        id: check
        run: |
          tag_date=$(echo "${{ github.ref_name }}" | grep -oP '(?<=-nightly\.)\d{8}')
          today_utc=$(date -u +%Y%m%d)
          echo "Tag date: $tag_date"
          echo "Today (UTC): $today_utc"
          if [[ "$tag_date" == "$today_utc" ]]; then
            echo "is_current=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Nightly tag date ($tag_date) does not match today's UTC date ($today_utc). Skipping scenario tests."
          fi

  # End-to-end tests that target a network deployment.
  # We run this every release (at minimum, nightly), or when explicitly requested.
  # The scenario runner lives in test-network-scenarios.yml (also manually dispatchable);
  # it derives the docker image and namespace from this run's tag or PR context.
  ci-network-scenario:
    # We run on the current main (v6) public nightly tag, or when the ci-network-scenario label is present in a PR.
    needs: [ci, validate-nightly-tag]
    # TODO(A-1813): Disabled.
    if: |
      false &&
      always()
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
      && github.event.pull_request.head.repo.fork != true
      && github.event.pull_request.draft == false
      && (
        (
          needs.validate-nightly-tag.outputs.is_current == 'true'
          && startsWith(github.ref_name, 'v6.')
        )
        || contains(github.event.pull_request.labels.*.name, 'ci-network-scenario')
      )
    permissions:
      id-token: write # OIDC assume-role with AWS
      contents: read # EC2 instance clones the repo with the token
      actions: write # slack_notify_with_claudebox_kickoff dispatches claudebox.yml
      pull-requests: write # remove the one-time-use label
    uses: ./.github/workflows/test-network-scenarios.yml
    secrets: inherit

  # Spartan network benchmarks triggered on-demand from a PR label.
  # The runner lives in test-network-bench.yml (also manually dispatchable).
  ci-network-bench:
    needs: ci
    # TODO(A-1813): Disabled.
    if: false && github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci-network-bench') && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    permissions:
      id-token: write # OIDC assume-role with AWS
      contents: read # EC2 instance clones the repo with the token
      pull-requests: write # remove the one-time-use label
    uses: ./.github/workflows/test-network-bench.yml
    secrets: inherit

  # KIND-based e2e tests triggered on-demand from a PR label.
  # The runner lives in test-network-kind.yml (also manually dispatchable).
  ci-network-kind:
    needs: ci
    # TODO(A-1813): Disabled.
    if: false && github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci-network-kind')
    permissions:
      id-token: write # OIDC assume-role with AWS
      contents: read # EC2 instance clones the repo with the token
      pull-requests: write # remove the one-time-use label
    uses: ./.github/workflows/test-network-kind.yml
    secrets: inherit
