# Spartan network benchmarks: TPS and proving benchmarks against a deployed network.
#
# Every checkout in this file is pinned to main. These jobs hold the `deployment` environment's GCP credential, so the
# code they run must not be selectable by whoever dispatches them; the version under test is the
# docker image, which is what the inputs below choose. A dispatch with no image benchmarks today's
# nightly, the same thing the (currently disabled) schedule does.
name: Test Network Bench

on:
  # schedule:
  #   # Run every morning at 6:00 AM UTC, after the nightly tag (04:00 UTC) has built.
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      bench_type:
        description: Benchmark to run (benchmark, proving-benchmark, or empty for both in parallel)
        required: false
        type: string
        default: ""
      docker_image:
        description: Docker image to benchmark, e.g. azteclabs/aztec:6.0.0-nightly.20260921. Empty uses today's nightly.
        required: false
        type: string
        default: ""

# id-token: write lets the job assume the AWS role via OIDC.
# actions: read covers wait_for_release's workflow-run queries.
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # Resolves the image under test: the input if given, otherwise today's nightly (never
  # "latest", so a broken tag cron fails here instead of silently re-benching an old release).
  select-image:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.image.outputs.docker_image }}
      release_tag: ${{ steps.image.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve the image under test
        id: image
        env:
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_DOCKER_IMAGE" ]]; then
            docker_image="$INPUT_DOCKER_IMAGE"
            release_tag=""
          else
            current_version=$(jq -r '."."' .release-please-manifest.json)
            docker_image="azteclabs/aztec:${current_version}-nightly.$(date -u +%Y%m%d)"
            release_tag="v${current_version}-nightly.$(date -u +%Y%m%d)"
          fi
          # This value is written to $GITHUB_OUTPUT and reaches a run: script, so anything that
          # could forge a second output line or break out of a quoted argument is refused. The
          # rejected value is deliberately not echoed, for the same reason.
          if [[ ! "$docker_image" =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]*$ ]]; then
            echo "::error::Invalid docker image reference rejected."
            exit 1
          fi
          # An untagged reference resolves to :latest, which these runs never want and which the
          # terraform that splits the reference on ':' cannot handle.
          if [[ "${docker_image##*/}" != *:* ]]; then
            echo "::error::Name the tag explicitly, e.g. azteclabs/aztec:6.0.0-nightly.20260921"
            exit 1
          fi
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Benchmarking image: $docker_image"

      # A named image has to exist already; a derived nightly is gated by wait-for-release instead,
      # since its release build may still be running.
      - name: Verify the image exists
        if: steps.image.outputs.release_tag == ''
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.docker_image }}
        run: docker manifest inspect "$DOCKER_IMAGE" >/dev/null

  # Block until the nightly tag's release build has published the docker image,
  # so the deploys below don't race the build and hit ImagePullBackOff.
  wait-for-release:
    needs: select-image
    # Only a derived nightly needs the gate; a named image was verified above.
    if: needs.select-image.outputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for release
        run: spartan/scripts/wait_for_release.ts "${{ needs.select-image.outputs.release_tag }}"

  bench:
    name: ${{ matrix.bench_type }}
    needs: [select-image, wait-for-release]
    # The gate is skipped for a named image and must pass for a derived nightly.
    if: ${{ !cancelled() && needs.select-image.result == 'success' && needs.wait-for-release.result != 'failure' }}
    runs-on: ubuntu-latest
    # GCP_HELM_SA_KEY lives in the deployment environment, whose policy admits only main.
    environment: deployment
    strategy:
      fail-fast: false
      # An empty bench_type input runs both benchmarks in parallel; otherwise just the selected one.
      matrix:
        include: ${{ fromJSON(inputs.bench_type == 'benchmark' && '[{"bench_type":"benchmark","ci3_cmd":"network-bench","scenario":"tps-scenario","namespace_suffix":"bench","timeout":300}]' || inputs.bench_type == 'proving-benchmark' && '[{"bench_type":"proving-benchmark","ci3_cmd":"network-proving-bench","scenario":"prove-n-tps-fake","namespace_suffix":"proving-bench","timeout":240}]' || '[{"bench_type":"benchmark","ci3_cmd":"network-bench","scenario":"tps-scenario","namespace_suffix":"bench","timeout":300},{"bench_type":"proving-benchmark","ci3_cmd":"network-proving-bench","scenario":"prove-n-tps-fake","namespace_suffix":"proving-bench","timeout":240}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: test-network-bench-${{ github.run_id }}
          role-duration-seconds: 19800 # 5.5h – covers the longest matrix timeout (300 min) + 30 min buffer

      - name: Run Network Benchmarks
        timeout-minutes: ${{ matrix.timeout }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_HELM_SA_KEY: ${{ secrets.GCP_HELM_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CI3_INSTANCE_PROFILE_NAME: ${{ vars.CI3_INSTANCE_PROFILE_NAME }}
          CI3_SECURITY_GROUP_ID: ${{ vars.CI3_SECURITY_GROUP_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: ${{ matrix.timeout }}
          NO_SPOT: 1
          DOCKER_IMAGE: ${{ needs.select-image.outputs.docker_image }}
        run: |
          namespace=run-$RUN_ID-${{ matrix.namespace_suffix }}
          echo "NAMESPACE=$namespace" >> $GITHUB_ENV
          set -x
          ./.github/ci3.sh ${{ matrix.ci3_cmd }} ${{ matrix.scenario }} "$namespace" "$DOCKER_IMAGE"

      - name: Cleanup network resources
        if: always()
        continue-on-error: true
        uses: ./.github/actions/network-teardown
        with:
          env_file: ${{ matrix.scenario }}
          namespace: ${{ env.NAMESPACE }}
          gcp_helm_sa_key: ${{ secrets.GCP_HELM_SA_KEY }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
