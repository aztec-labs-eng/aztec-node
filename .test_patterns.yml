flake_groups:
  # flake_error_threshold: Only use during times of expected instability (eg. pre-release crunch).
  # Threshold of 5 = tolerate at most 4 flakes before failing the build.
  # DO NOT expand use of this feature without buy-in from the team. It's a last resort, not a standard practice.
  - id: e2e-p2p-epoch-flakes
    name: "E2E P2P and Epoch Tests"
    flake_error_threshold: 5

tests:
  # Nightly GKE tests
  - regex: "spartan/bootstrap.sh"
    retry: true
    owners: [*alex]

  # Contract artifact backwards-compat tests run in full CI only, so a PR's own CI usually does not catch a break.
  - regex: "^CONTRACT_ARTIFACTS_VERSION="
    notify_on: [fail, flake]
    channel: "#team-fairies"
    owners: [*nico]

  # Slack testing.
  - regex: "nonsense to match"
    error_regex: "something else"
    retry: true
    owners: [*charlie, *adam]

  # Blanket flake patterns for unstable p2p, epoch, and l1 tx utils tests
  # This is a temporary measure while team bandwidth is constrained
  # Replaced many specific patterns - see https://github.com/AztecProtocol/aztec-packages/pull/17962 for historical context
  - regex: "src/p2p/.*\\.test\\.ts"
    flake_group_id: e2e-p2p-epoch-flakes
    retry: true
    owners: [*phil]

  - regex: "src/single-node/.*\\.test\\.ts"
    flake_group_id: e2e-p2p-epoch-flakes
    retry: true
    owners: [*palla]

  - regex: "src/multi-node/.*\\.test\\.ts"
    flake_group_id: e2e-p2p-epoch-flakes
    retry: true
    owners: [*palla]

  - regex: "src/automine/.*\\.test\\.ts"
    flake_group_id: e2e-p2p-epoch-flakes
    retry: true
    owners: [*palla]

  - regex: "p2p/src/client/test/.*\\.test\\.ts"
    flake_group_id: e2e-p2p-epoch-flakes
    retry: true
    owners: [*palla, *phil]

  # tx_stats_bench's 10 TPS sub-test occasionally returns valid:false from a single IVC
  # verification under heavy concurrency (8 parallel verifiers, each spawning a fresh bb subprocess
  # via the bb.js NativeUnixSocket backend introduced in #21564). The serial sub-tests pass.
  - regex: "tx_stats_bench"
    error_regex: "tx_stats_bench\\.test\\.ts:[0-9]+:[0-9]+"
    retry: true
    owners: [*charlie]
