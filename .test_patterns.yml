# Describes how CI treats the tests whose command matches an entry's "regex".
# If an optional error_regex is provided, the test's output must also match for the entry to apply.
#   skip: true       Outright skip the test.
#                    Only do this for tests that are currently expected to fail constantly and the noise is unbearable!
#   retry: true      Retry a failing test once; a pass on the retry is a flake and does not fail the build.
#                    A failing test that matches no entry with retry: true fails the build.
#   notify_on: [...] The events that post to Slack: flake, fail, or both. Default: [flake].
#   channel: "#..."  The Slack channel those posts go to. Default: #aztec3-ci.
#   owners: [...]    Who those posts tag. Owners are identified by their Slack id, (profile, three dots, copy member id).

names:
  - adam: &adam "U04BM8H25NJ"
  - akosh: &akosh "U07PQ3Y4GHJ"
  - alex: &alex "U05QWV669JB"
  - charlie: &charlie "UKUMA5J7K"
  - david: &david "U03T2QRT1NW"
  - grego: &grego "U0689QRCE9L"
  - lasse: &lasse "U03E5SYLY3Z"
  - leila: &leila "UBLTU1NJ3"
  - luke: &luke "U03JYU7AQET"
  - mitch: &mitch "U06AY5G1NRK"
  - palla: &palla "U04TPBU26E8"
  - phil: &phil "U02G4KAD57Y"
  - sean: &sean "U04DT239VQU"
  - tom: &tom "U04LLT331NK"
