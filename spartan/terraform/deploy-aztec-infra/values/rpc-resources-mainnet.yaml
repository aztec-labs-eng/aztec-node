nodeSelector:
  local-ssd: "false"
  node-type: "network"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: cores
              operator: In
              values:
                - "4"

replicaCount: 1

node:
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 16Gi

service:
  p2p:
    enabled: true
    nodePortEnabled: false
  admin:
    enabled: true
  headless:
    enabled: false
