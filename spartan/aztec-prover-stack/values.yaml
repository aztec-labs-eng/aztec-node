global:
  aztecEnv:
    ROLLUP_VERSION: "canonical"
  aztecNetwork: ""
  customAztecNetwork:
    enabled: false

  l1ExecutionUrls: []
  l1ConsensusUrls: []
  l1ConsensusHostApiKeys: ""
  l1ConsensusHostApiKeyHeaders: ""

node:
  nodeType: "prover-node"
  mnemonic: "test test test test test test test test test test test junk"
  mnemonicStartIndex: 1000
  privateKey:

  persistence:
    enabled: false
  statefulSet:
    enabled: true

  replicaCount: 1

  extraContainers: '{{ include "prover.oxideSidecar.container" . }}'
  initContainers: '{{ include "prover.oxideSidecar.initContainer" . }}'
  extraVolumes: '{{ include "prover.oxideSidecar.volumes" . }}'

  node:
    env:
      OTEL_SERVICE_NAME: "prover-node"
      PROVER_AGENT_COUNT: 0
      # Set this to your web3signer URL (e.g. http://web3signer.namespace.svc.cluster.local:9000/)
      WEB3_SIGNER_URL: ""
      # Derivation for publisher addresses when using web3signer
      PUBLISHERS_PER_PROVER: "1"
      PUBLISHER_KEY_INDEX_START: "8000"
    # -- Optional epoch-proof worker; see oxide-relayer.md for activation requirements.
    oxideSidecar:
      enabled: false
      image: "azteclabs/oxide-relayer@sha256:e3bc6eb730aad40ec0ec46c8f16c09484bbc18e79cd17a364cb83f7e6571762f"
      manifestUrl: ""
      portal: ""
      proofSubmissionTarget: ""
      provingCostPerCheckpoint: ""
      minProfit: ""
      minProfitMarginBps: ""
      startupTimeoutSeconds: 1200
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    web3signerUrl: ""

    preStartScript: |
      export TX_COLLECTION_NODE_RPC_URLS=$(bash /scripts/resolve-node-hosts.sh $NODE_HOSTS)
      source /scripts/setup-prover-keystore.sh

    startCmd:
      - --prover-node

    configMap:
      envEnabled: true
    secret:
      envEnabled: true

  service:
    p2p:
      enabled: true
      nodePortEnabled: false
    admin:
      enabled: true
    headless:
      enabled: false

broker:
  nodeType: "prover-broker"
  replicaCount: 1
  persistence:
    enabled: false
  statefulSet:
    enabled: true

  node:
    env:
      OTEL_SERVICE_NAME: "prover-broker"
      RPC_MAX_BODY_SIZE: "50mb"
    startCmd:
      - --prover-broker
    readinessProbe:
      enabled: false

  hostNetwork: false

  service:
    p2p:
      enabled: false
      nodePortEnabled: false
  rbac:
    create: false
  serviceAccount:
    create: false

agent:
  nodeType: "prover-agent"
  replicaCount: 1

  # -- Give agents time to finish an in-flight proof on scale-down
  terminationGracePeriodSeconds: 300

  autoscaling:
    keda:
      enabled: false
      pollingInterval: 30
      cooldownPeriod: 300
      minReplicaCount: 0
      maxReplicaCount: 1
      scalingBands: []
      prometheus:
        serverAddress: ""

  persistence:
    enabled: false

  statefulSet:
    enabled: false

  node:
    env:
      OTEL_SERVICE_NAME: "prover-agent"
    configMap:
      envEnabled: true
    preStartScript: |
      source /scripts/wait-for-broker.sh
    startCmd:
      - --prover-agent
    readinessProbe:
      enabled: false

  service:
    p2p:
      enabled: false
      nodePortEnabled: false

  rbac:
    create: false
  serviceAccount:
    create: false
