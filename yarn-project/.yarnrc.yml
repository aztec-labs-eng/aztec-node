compressionLevel: mixed

enableGlobalCache: false

logFilters:
  - code: YN0013
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 7d

# First-party packages, published by our own release CI and pinned to exact
# versions; nightlies are consumed the day they are published, so they cannot
# sit out the age gate. @aztec-foundation holds the foundation packages this repo
# pins, @aztec-labs is what it publishes, and @aztec is the viem fork.
npmPreapprovedPackages: ['@aztec/*', '@aztec-labs/*', '@aztec-foundation/*']

# Do not allow 'yarn install' on CI to format package.json files,
# otherwise it will change their hash and bust the cache
immutablePatterns: ['package.json', '*/package.json']
